name: Weekly link report

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check external reachability without changing the catalog
        run: python scripts/check_links.py --report-only --json reports/link-check.json --markdown reports/link-check.md
      - name: Publish review report in workflow summary
        if: always()
        run: |
          if [ -f reports/link-check.md ]; then
            cat reports/link-check.md >> "$GITHUB_STEP_SUMMARY"
          fi
