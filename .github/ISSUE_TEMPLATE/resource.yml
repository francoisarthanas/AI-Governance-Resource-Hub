name: Suggest a must-have resource
description: Propose one source with a concrete governance use case and distinctive value.
title: "Resource: "
body:
  - type: input
    id: source
    attributes:
      label: Resource title and primary source URL
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What will a reader accomplish with it?
      description: Name the decision, skill, evidence, or work product it supports.
    validations:
      required: true
  - type: textarea
    id: distinction
    attributes:
      label: Why is this essential compared with what is already here?
      description: Identify an existing alternative and any resource this should replace.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Version, access, and checks performed
      description: Include the publisher, source status, costs or registration, review date, and any access restriction.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Any affiliation or commercial interest?
      placeholder: None, or describe the relationship.
    validations:
      required: true
