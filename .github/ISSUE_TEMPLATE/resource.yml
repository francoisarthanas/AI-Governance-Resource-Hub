name: Suggest a resource or correction
description: Recommend a valuable source, fix a broken link, or correct a description.
title: "Suggestion: "
body:
  - type: input
    id: source
    attributes:
      label: Resource title and URL
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What should be added or corrected, and why?
      description: Describe the problem or explain what a reader can accomplish with the new resource.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Audience and access for a new resource
      description: Include the publisher, intended audience, costs or requirements, and what it adds to the collection.
    validations:
      required: false
  - type: input
    id: affiliation
    attributes:
      label: Any affiliation or commercial interest?
      description: Disclose a relationship with the resource or publisher when applicable.
    validations:
      required: false
